[package]
name = "atm-desktop"
version = "0.1.0"
description = "Agent Tool Manager desktop application"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
# Preserve Mach-O metadata: Xcode beta's strip can produce unaligned proc-macro dylibs.
strip = "none"
