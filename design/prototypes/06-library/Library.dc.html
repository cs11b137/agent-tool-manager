body{margin:0}

.lg[data-theme=dark]{--ink:#F2F4F8;--ink2:#C3C8D1;--ink3:#9097A3;--accent:#3D8BFF;--accent-h:#5A9CFF;--accent-soft:rgba(61,139,255,.18);--accent-ink:#8DBBFF;--glass:rgba(28,32,42,.56);--glass-2:rgba(28,32,42,.34);--glass-strong:rgba(36,40,52,.86);--edge:rgba(255,255,255,.12);--hi:rgba(255,255,255,.08);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.2);--shadow:0 2px 12px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.35);--bg:#0D1017;--b1:#1D4ED8;--b2:#6D28D9;--b3:#0E7490;--b4:#9D174D;--skill:#5FD3E2;--skill-ink:#86E3EE;--skill-soft:rgba(95,211,226,.16);--mcp:#3D8BFF;--mcp-ink:#8DBBFF;--mcp-soft:rgba(61,139,255,.18);--plugin:#B795FF;--plugin-ink:#C9AEFF;--plugin-soft:rgba(183,149,255,.16);--err-ink:#FF8A80;--err-soft:rgba(255,99,88,.16);--warn-ink:#FFC266;--warn-soft:rgba(255,184,77,.16);--ok-ink:#5CE0A0;--ok-soft:rgba(92,224,160,.14)}
.mesh{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:42% 58% 63% 37%/45% 41% 59% 55%;filter:blur(64px);opacity:.72;animation:morph 22s ease-in-out infinite alternate}
.blob.b2{animation-duration:26s;animation-direction:alternate-reverse}.blob.b3{animation-duration:30s}
@keyframes morph{0%{transform:translate(0,0) rotate(0) scale(1)}50%{transform:translate(60px,-40px) rotate(40deg) scale(1.12)}100%{transform:translate(-40px,30px) rotate(-20deg) scale(.94)}}

.iri{position:relative}.iri::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:linear-gradient(120deg,#6FA8FF,#C7A6FF 30%,#8EE6E0 60%,#FFB8D5);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.9}

.seg{height:34px;padding:0 14px;border:0;border-radius:999px;font:500 13px var(--sans);cursor:pointer;transition:background-color .4s,color .4s,box-shadow .4s}
.row{transition:background-color .3s}.row:hover{background:var(--glass-2)}

.swap{animation:swap .45s cubic-bezier(.2,.8,.2,1) both}

</style>

<div class="blob b2" style="width: 40%; height: 55%; top: 5%; left: 68%; background: var(--b1)"></div>
<div class="blob b3" style="width: 38%; height: 50%; top: 60%; left: 10%; background: var(--b2)"></div>
<div class="blob" style="width: 34%; height: 45%; top: 65%; left: 70%; background: var(--b4)"></div>
</div>

<nav aria-label="主导航" class="glass" style="flex: 1 1 220px; box-sizing: border-box; padding: 20px 12px; border-radius: 20px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px"><span style="width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, #0066FF, #8E6CFF); color: #FFFFFF; font: 600 12px var(--mono); display: flex; align-items: center; justify-content: center">atm</span><strong style="font-size: 15px">Agent Tool Manager</strong></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<a href="Overview.dc.html" class="nv"><span class="dot"></span>总览</a>

<span class="nv" style="color: var(--ink3)"><span class="dot"></span>全局<span class="mono" style="margin-left: auto; font-size: 11px">P5</span></span>

<span class="nv mono" style="font-size: 13px; color: var(--ink)"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--err); flex-shrink: 0"></span>agent-tool-manager</span>
<span class="nv mono" style="font-size: 13px; color: var(--ink3); text-decoration: line-through"><span style="width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink3); box-sizing: border-box; flex-shrink: 0"></span>old-landing</span>

<span class="mono">127.0.0.1:52817</span>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 16px 8px; display: flex; flex-direction: column; gap: 20px">
<div class="rise" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span class="cap">~/GitHub · MCP registry · 已安装插件</span>
<h1 class="ca" style="margin: 0; font-size: 36px; font-weight: 700; letter-spacing: -0.02em">工具库</h1>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" class="btn btn-g">克隆仓库…</button>
<button type="button" class="btn btn-g">新建 MCP 定义…</button>
</div>
</div>

<div class="rise d1" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
<div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 6px">
<label for="lib-search" style="font-size: 13px; font-weight: 500; color: var(--ink2)">搜索工具</label>
<input id="lib-search" type="search" placeholder="按名称、仓库或描述搜索" style="height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line2); background: var(--glass-strong); color: var(--ink); font: 14px var(--sans)">
</div>

<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" role="tab" class="seg" aria-selected="{{f.selected}}" onClick="{{f.pick}}" style="background: {{f.bg}}; color: {{f.color}}; box-shadow: {{f.shadow}}">{{f.label}} <span class="mono" style="font-size: 12px; opacity: .7">{{f.count}}</span></button>
</sc-for>

</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">

<section aria-label="工具列表" class="glass rise d2" style="flex: 999 1 520px; min-width: 0; border-radius: 20px; overflow: hidden">
<div style="overflow-x: auto">
<div style="min-width: 640px">
<div class="cap" style="display: grid; grid-template-columns: 84px minmax(0, 2.2fr) minmax(0, 1.4fr) 96px 64px; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line)"><span>类型</span><span>名称</span><span>来源</span><span>使用</span><span style="text-align: right">tokens</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<button type="button" class="row" onClick="{{r.pick}}" aria-pressed="{{r.selected}}" style="width: 100%; display: grid; grid-template-columns: 84px minmax(0, 2.2fr) minmax(0, 1.4fr) 96px 64px; gap: 12px; align-items: center; min-height: 60px; padding: 8px 18px; border: 0; border-bottom: 1px solid var(--line); background: {{r.rowBg}}; color: var(--ink); text-align: left; font-family: var(--sans); cursor: pointer">
<span class="{{r.chipCls}}" style="justify-self: start">{{r.kindLabel}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span class="mono" style="font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</span><span style="font-size: 12px; color: var(--ink3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.desc}}</span></span>
<span class="mono" style="font-size: 12px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.source}}</span>

<aside aria-label="添加到项目" class="glass iri rise d3" style="flex: 1 1 300px; box-sizing: border-box; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 18px; background: var(--glass-strong)">
<div class="swap" style="display: flex; flex-direction: column; gap: 8px">
<span class="{{sel.chipCls}}" style="align-self: flex-start">{{sel.kindLabel}}</span>
<h2 class="mono ca" style="margin: 0; font-size: 22px; font-weight: 600; word-break: break-all">{{sel.name}}</h2>

<code class="mono" style="font-size: 12px; color: var(--ink3); word-break: break-all">{{sel.source}}</code>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend class="cap" style="padding: 0 0 10px">添加到项目</legend>
<sc-for list="{{sel.projects}}" as="p" hint-placeholder-count="3">
<label class="pj" style="color: {{p.color}}"><input type="checkbox" checked="{{p.checked}}" disabled="{{p.disabled}}">{{p.name}}<span style="margin-left: auto; font: 12px var(--sans); color: var(--ink3)">{{p.hint}}</span></label>
</sc-for>
</fieldset>
<a href="AddDiff.dc.html" class="btn btn-p" style="height: 44px">预览 diff</a>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: var(--ink3)">会对每个勾选的项目分别执行 dryRun，确认后一次写入。</p>
</aside>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { filter: 'all', selKey: 'mcp:linear' };
}
renderVals() {
const self = this;
const kinds = {
skill: { kindLabel: 'SKILL', chipCls: 'chip c-skill' },
mcp: { kindLabel: 'MCP', chipCls: 'chip c-mcp' },
plugin: { kindLabel: 'PLUGIN', chipCls: 'chip c-plugin' }
};
const all = [
{ kind: 'skill', name: 'baoyu-comic', desc: 'skills/baoyu-comic', source: 'jimliu/baoyu-skills', in: ['web-app', 'agent-tool-manager'], tok: '96' },
{ kind: 'skill', name: 'baoyu-cover', desc: 'skills/baoyu-cover', source: 'jimliu/baoyu-skills', in: ['web-app'], tok: '88' },
{ kind: 'skill', name: 'agent-tools', desc: 'atm 入口 Skill · 全局安装', source: '~/GitHub/atm/skill', in: [], global: true, tok: '—' },
{ kind: 'mcp', name: 'figma', desc: 'Figma 设计文件读取', source: 'registry · stdio', in: ['web-app'], tok: '4.2k' },
{ kind: 'mcp', name: 'playwright', desc: 'registry · stdio · npx', source: 'registry · stdio', in: ['web-app', 'agent-tool-manager'], tok: '1.4k' },
{ kind: 'mcp', name: 'linear', desc: 'https://mcp.linear.app/mcp', source: 'registry · http', in: [], tok: '?' },
{ kind: 'plugin', name: 'security-guidance', desc: '@claude-plugins-official', source: 'installed_plugins.json', in: ['web-app'], tok: '0.3k' },
{ kind: 'plugin', name: 'figma', desc: '@claude-plugins-official · 自带 MCP', source: 'installed_plugins.json', in: [], global: true, tok: '?' }
];
const f = this.state.filter;
const counts = { all: all.length, skill: 0, mcp: 0, plugin: 0 };
all.forEach(function (t) { counts[t.kind]++; });
const filters = [['all', '全部'], ['skill', 'Skill'], ['mcp', 'MCP'], ['plugin', '插件']].map(function (x) {
const on = x[0] === f;
return { label: x[1], count: counts[x[0]], selected: on ? 'true' : 'false', bg: on ? 'var(--glass-strong)' : 'transparent', color: on ? 'var(--ink)' : 'var(--ink2)', shadow: on ? '0 2px 8px rgba(16,24,40,.12), inset 0 1px 0 var(--hi)' : 'none', pick: function () { self.setState({ filter: x[0] }); } };
});
const key = function (t) { return t.kind + ':' + t.name; };
const selKey = this.state.selKey;
const rows = all.filter(function (t) { return f === 'all' || t.kind === f; }).map(function (t) {
const on = key(t) === selKey;
return Object.assign({}, t, kinds[t.kind], {
used: t.global ? '全局' : (t.in.length ? t.in.length + ' 个项目' : '未使用'),
usedColor: t.in.length || t.global ? 'var(--ink)' : 'var(--ink3)',
selected: on ? 'true' : 'false',
rowBg: on ? 'var(--accent-soft)' : 'transparent',
pick: function () { self.setState({ selKey: key(t) }); }
});
});
const s = all.filter(function (t) { return key(t) === selKey; })[0] || all[5];
const projects = [
{ name: 'web-app', exists: true },
{ name: 'agent-tool-manager', exists: true },
{ name: 'old-landing', exists: false }
].map(function (p) {
const has = s.in.indexOf(p.name) >= 0;
return {
name: p.name,
checked: has || (p.exists && p.name === 'web-app'),
disabled: has || !p.exists,
color: p.exists ? 'var(--ink)' : 'var(--ink3)',
hint: !p.exists ? '目录缺失' : (has ? '已在用' : '')
};
});
return { theme: this.props.theme ?? 'light', filters: filters, rows: rows, sel: Object.assign({}, s, kinds[s.kind], { projects: projects }) };
}
}
</script>
