<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>atm Console · v3 设计原型</title>
<style>
/* ═════════ tokens（与 design/redesign/tokens.css 同步）═════════ */
:root{
  --bg:oklch(.975 .003 262); --surface:#fff; --surface-2:oklch(.955 .004 262); --overlay:#fff;
  --ink:oklch(.24 .01 262); --ink2:oklch(.45 .012 262); --ink3:oklch(.6 .014 262);
  --line:rgba(16,20,28,.08); --line2:rgba(16,20,28,.16);
  --accent:#0066ff; --accent-h:#005ce6; --accent-soft:rgba(0,102,255,.1); --accent-ink:#0052cc;
  --skill:#1499ac; --skill-ink:#0a6474; --skill-soft:rgba(20,153,172,.12);
  --mcp:#0066ff; --mcp-ink:#0052cc; --mcp-soft:rgba(0,102,255,.1);
  --plugin:#7c3aed; --plugin-ink:#5b2bb5; --plugin-soft:rgba(124,58,237,.1);
  --err:#d92d20; --err-ink:#b42318; --err-soft:rgba(217,45,32,.1);
  --warn:#dc8a0e; --warn-ink:#8a4b06; --warn-soft:rgba(220,138,14,.14);
  --ok:#079455; --ok-ink:#067647; --ok-soft:rgba(7,148,85,.1);
  --scrim:rgba(16,20,28,.32);
  --shadow:0 4px 16px rgba(16,24,40,.1),0 16px 40px rgba(16,24,40,.12);
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Noto Sans SC','Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r-cell:4px; --r-card:8px; --r-panel:10px; --r-dialog:12px;
  --ease:cubic-bezier(.2,.8,.2,1); --d1:120ms; --d2:180ms;
  --row-h:40px; --pad:16px;
  color-scheme:light;
}
[data-theme='dark']{
  --bg:oklch(.17 .006 262); --surface:oklch(.21 .006 262); --surface-2:oklch(.25 .007 262); --overlay:oklch(.23 .007 262);
  --ink:oklch(.96 .004 262); --ink2:oklch(.76 .008 262); --ink3:oklch(.585 .012 262);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --accent:#3d8bff; --accent-h:#5a9cff; --accent-soft:rgba(61,139,255,.14); --accent-ink:#8dbbff;
  --skill:#5fd3e2; --skill-ink:#86e3ee; --skill-soft:rgba(95,211,226,.14);
  --mcp:#3d8bff; --mcp-ink:#8dbbff; --mcp-soft:rgba(61,139,255,.14);
  --plugin:#b795ff; --plugin-ink:#c9aeff; --plugin-soft:rgba(183,149,255,.14);
  --err:#ff6a5e; --err-ink:#ff8a80; --err-soft:rgba(255,106,94,.14);
  --warn:#ffb84d; --warn-ink:#ffc266; --warn-soft:rgba(255,184,77,.14);
  --ok:#34d399; --ok-ink:#5ce0a0; --ok-soft:rgba(52,211,153,.12);
  --scrim:rgba(0,0,0,.45);
  color-scheme:dark;
}
body.compact{ --row-h:32px; --pad:12px; }

/* ═════════ base ═════════ */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.cap{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
svg.ic{width:16px;height:16px;stroke-width:1.75;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-cell)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (prefers-contrast:more){:root{--line:rgba(16,20,28,.28);--line2:rgba(16,20,28,.4)}[data-theme='dark']{--line:rgba(255,255,255,.24);--line2:rgba(255,255,255,.36)}}

/* ═════════ shell ═════════ */
#app{display:grid;grid-template-columns:232px 1fr;height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.side-brand{display:flex;align-items:center;gap:9px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.logo{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 11px var(--mono)}
.side-brand b{font-size:13px;font-weight:600}
.side-brand span{font:11px var(--mono);color:var(--ink3)}
nav{padding:10px 8px;flex:1}
.nav-cap{padding:10px 8px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-cell);color:var(--ink2);cursor:pointer;font-size:13px;border:0;background:none;width:100%;text-align:left;transition:background var(--d1) var(--ease),color var(--d1)}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.on{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 2px 0 0 var(--accent)}
.nav-item.on svg{color:var(--accent)}
.nav-item .cnt{margin-left:auto;font:11px var(--mono);color:var(--ink3)}
.nav-item.miss{color:var(--ink3)}
.nav-item.miss .nm{text-decoration:line-through;text-decoration-color:var(--err)}
.side-foot{border-top:1px solid var(--line);padding:8px;display:flex;gap:6px;align-items:center}

/* topbar */
.main{display:flex;flex-direction:column;overflow:hidden}
.top{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);background:color-mix(in oklab,var(--bg),var(--surface) 40%)}
.crumb{display:flex;align-items:center;gap:6px;color:var(--ink3);font-size:12.5px}
.crumb b{color:var(--ink);font-weight:600}
.crumb svg{width:13px;height:13px}
.top .sp{flex:1}
.kbd{font:11px var(--mono);color:var(--ink3);border:1px solid var(--line2);border-radius:var(--r-cell);padding:2px 6px;display:inline-flex;gap:4px;align-items:center;cursor:pointer;transition:border-color var(--d1)}
.kbd:hover{border-color:var(--ink3)}
.scroll{flex:1;overflow-y:auto}
.page{max-width:1180px;margin:0 auto;padding:20px 24px 48px;animation:pg var(--d2) var(--ease)}
@keyframes pg{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.phead h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.phead .sub{margin-top:2px;color:var(--ink3);font-size:12px}
.phead .sub .mono{color:var(--ink2)}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ═════════ primitives ═════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r-cell);border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:500 12.5px var(--sans);cursor:pointer;transition:background var(--d1) var(--ease),border-color var(--d1),color var(--d1),transform var(--d1)}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--accent);border-color:transparent;color:#fff}
.btn.p:hover{background:var(--accent-h)}
.btn.d{background:var(--err-soft);border-color:var(--err);color:var(--err-ink)}
.btn.t{border-color:transparent;background:none;color:var(--ink2)}
.btn.t:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.icb{width:28px;height:28px;padding:0}

.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px 0 6px;border:1px solid var(--line2);border-radius:var(--r-cell);font-size:11.5px;color:var(--ink2);background:transparent;white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;flex:none}
.chip.s-skill .dot{background:var(--skill)} .chip.s-mcp .dot{background:var(--mcp)} .chip.s-plugin .dot{background:var(--plugin)}
.chip.agent{color:var(--ink3);border-color:var(--line)}
.chip.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chip.sel .dot{background:var(--accent)}
.st{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r-cell);font-size:11.5px;font-weight:500}
.st.err{background:var(--err-soft);color:var(--err-ink)} .st.warn{background:var(--warn-soft);color:var(--warn-ink)} .st.ok{background:var(--ok-soft);color:var(--ok-ink)}
.g{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.g.e{background:var(--err)} .g.o{background:var(--ok)}
.g.w{width:6px;height:6px;border-radius:1px;background:var(--warn);transform:rotate(45deg)}
.g.i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink3)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card)}
.kpi{flex:1;min-width:150px;padding:12px var(--pad);display:flex;flex-direction:column;gap:3px}
.kpi .v{font:500 22px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink3)}
.kpi .s b{font-weight:500;color:var(--ink2)}

.inp{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-cell);color:var(--ink3);min-width:180px;transition:border-color var(--d1)}
.inp:focus-within{border-color:var(--accent)}
.inp input{border:0;outline:0;background:none;color:var(--ink);font:12.5px var(--sans);width:100%}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r-cell);overflow:hidden}
.seg button{border:0;background:none;padding:0 10px;height:28px;font:500 12px var(--sans);color:var(--ink3);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--surface-2);color:var(--ink)}
.sw{position:relative;width:30px;height:17px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line2);cursor:pointer;transition:background var(--d1);flex:none}
.sw i{position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--ink3);transition:left var(--d1) var(--ease),background var(--d1)}
.sw.on{background:var(--accent);border-color:transparent}
.sw.on i{left:15px;background:#fff}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);gap:2px;min-width:72px}
.bar b{border-radius:1.5px}
.hatch{background:repeating-linear-gradient(135deg,var(--line2) 0 3px,transparent 3px 6px)}

/* tables */
table{width:100%;border-collapse:collapse}
th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:0 10px;height:var(--row-h);border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background var(--d1) var(--ease)}
tbody tr:hover{background:var(--surface-2)}
tr.miss td{color:var(--ink3)}
tr.miss .nm{text-decoration:line-through;text-decoration-color:var(--err)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
td.num{color:var(--ink2)}
.feat td{background:color-mix(in oklab,var(--accent-soft) 55%,transparent)}
tr.feat:hover td{background:var(--accent-soft)}

/* ═════════ screens ═════════ */
.grid-kpi{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ov{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.feed{padding:2px 0}
.feed li{display:flex;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);list-style:none;font-size:12.5px;color:var(--ink2)}
.feed li:last-child{border-bottom:0}
.feed time{font:11px var(--mono);color:var(--ink3);flex:none;padding-top:1px}
.mtxwrap{overflow-x:auto}
.mtx td,.mtx th{padding:4px 6px}
.mtx td.c{text-align:center}
.cell{width:26px;height:22px;border-radius:var(--r-cell);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:var(--ink3);transition:all var(--d1)}
.cell.on{background:var(--accent);border-color:transparent;color:#fff}
.cell.add{border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.cell.rm{border:1.5px dashed var(--err);background:var(--err-soft);color:var(--err-ink)}
.cell.na{background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px);cursor:not-allowed}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);align-items:center;flex-wrap:wrap}
.legend i{width:13px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

.pending{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:var(--r-card);background:var(--accent-soft);border:1px dashed var(--accent);color:var(--accent-ink);font-size:12.5px}
.pending .sp{flex:1}

.issues td{height:44px}
.exp{display:none;padding:8px 10px 12px;color:var(--ink3);font-size:12.5px}
.exp code{font-family:var(--mono);color:var(--ink2)}
details[open] .exp{display:block}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}

/* dialog */
#scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity var(--d2);z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
.dlg{position:fixed;z-index:41;left:50%;top:8vh;transform:translate(-50%,8px);width:min(720px,92vw);max-height:82vh;display:none;flex-direction:column;background:var(--overlay);border:1px solid var(--line2);border-radius:var(--r-dialog);box-shadow:var(--shadow);opacity:0;transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease)}
.dlg.on{display:flex;opacity:1;transform:translate(-50%,0)}
.dlg-h{display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-bottom:1px solid var(--line);flex:none}
.dlg-h b{font-size:14px;font-weight:600}
.dlg-h .sp{flex:1}
.dlg-b{padding:16px 18px;overflow-y:auto}
.dlg-f{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex:none}
.dlg-f .sp{flex:1}
.frow{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.frow label{font-size:12px;color:var(--ink2);font-weight:500}
.fv{display:flex;gap:6px;flex-wrap:wrap}

.diff{border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;font:12px/1.7 var(--mono)}
.diff-h{display:flex;justify-content:space-between;background:var(--surface-2);padding:6px 12px;color:var(--ink2);font-size:11.5px;border-bottom:1px solid var(--line)}
.diff-b{white-space:pre;overflow-x:auto;padding:8px 0}
.diff-b div{padding:0 12px 0 0}
.diff-b .plus{background:var(--ok-soft)} .diff-b .plus::before{content:'+';padding:0 10px 0 12px;color:var(--ok-ink)}
.diff-b .minus{background:var(--err-soft)} .diff-b .minus::before{content:'−';padding:0 10px 0 12px;color:var(--err-ink)}
.diff-b .ctx{color:var(--ink3)} .diff-b .ctx::before{content:' ';padding:0 12px}

.empty{padding:36px 0;text-align:center;color:var(--ink3);font-size:12.5px}
.foot{max-width:1180px;margin:0 auto;padding:0 24px 16px;color:var(--ink3);font:11px var(--mono);display:flex;gap:14px}
.foot a{color:var(--ink3)}
@media (max-width:900px){ .ov{grid-template-columns:1fr} #app{grid-template-columns:64px 1fr} .side-brand b,.nav-item span,.nav-cap{display:none} .nav-item{justify-content:center} }
</style>
</head>

}
window.go = h => { location.hash = h; };
window.cycle = el => {
  const c = el.classList;
  const order = ['', 'add', 'rm', ''];
  const cur = c.contains('add') ? 1 : c.contains('rm') ? 2 : c.contains('on') ? 3 : 0;
  const next = (cur + 1) % 4;
  c.remove('on', 'add', 'rm');
  el.textContent = '';
  if (next === 1) c.add('add'), (el.textContent = '+');
  else if (next === 2) c.add('rm'), (el.textContent = '−');
  else if (next === 3) c.add('on'), (el.textContent = '✓');
};
document.querySelectorAll('[data-go]').forEach(n=>n.addEventListener('click',()=>go(n.dataset.go)));
addEventListener('hashchange', render);

const theme = document.getElementById('theme');
theme.onclick = () => {
  const dark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  theme.querySelector('use').setAttribute('href', dark ? '#i-sun' : '#i-moon');
};
document.getElementById('dens').onclick = () => document.body.classList.toggle('compact');

const scrim = document.getElementById('scrim'), dlg = document.getElementById('dlg');
window.openDlg = () => {
  document.getElementById('dlg-body').innerHTML = dlgBody();
  dlg.classList.add('on'); scrim.classList.add('on');
};
const closeDlg = () => { dlg.classList.remove('on'); scrim.classList.remove('on'); };
scrim.onclick = closeDlg;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick = closeDlg);
addEventListener('keydown', e => { if (e.key === 'Escape') closeDlg(); });

window.toast = btn => {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;right:20px;bottom:20px;z-index:50;background:var(--overlay);border:1px solid var(--line2);border-left:3px solid var(--ok);border-radius:8px;box-shadow:var(--shadow);padding:10px 14px;font-size:12.5px;display:flex;gap:8px;align-items:center`;
  t.innerHTML = `<i class="g o"></i>已修复 web-app 的 skill 断链`;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity 300ms'; setTimeout(()=>t.remove(),300); }, 2400);
  btn.disabled = true; btn.textContent = '已修复';
};
render();
</script>
</body>
